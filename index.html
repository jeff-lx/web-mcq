    <meta charset="UTF-8" />

    <title>Web MCQ</title>
    <script>
      window.unityData = {};
      if (window.vuplex) {
        addMessageListener();
      } else {
        window.addEventListener('vuplexready', addMessageListener);
      }
      function addMessageListener() {
        window.vuplex.addEventListener('message', event => {
          try {
            // Handle both string and object data types safely
            const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            window.unityData = data.sheets || {};
            // Dispatch a custom event to notify React app that data is ready
            window.dispatchEvent(new CustomEvent('unityDataReady'));
          } catch (e) {
            console.error('Error parsing Unity message:', e);
          }
        });
      }
    </script>
